[tool.poetry]
name = "ios-app-xtool-mcp"
version = "1.0.0"
description = "MCP server for xtool: build, sign, and deploy iOS apps via SwiftPM"
authors = ["xtool-org"]
license = "MIT"
packages = [{ include = "tools" }]

[tool.poetry.dependencies]
python = "^3.10"
mcp = ">=1.0.0"
pydantic = ">=2.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
